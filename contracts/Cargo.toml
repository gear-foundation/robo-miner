[workspace]
resolver = "3"
members = [
    "digger-world",
    "digger-world/app",
    "digger-world/client",
    "digger-proxy",
    "digger-proxy/app",
    "digger-proxy/client",
    "digger-res-vmt",
    "digger-res-vmt/app",
    "digger-res-vmt/client",
    "digger-redeem",
    "digger-redeem/app",
    "digger-redeem/client",
]

[workspace.package]
version = "0.1.0"
authors = ["Digger Contributors"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/gear-foundation/vara-eth-skills"
license = "MIT"
keywords = ["gear", "sails", "vara-eth", "game", "wasm"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
sails-rs = "1.0.0-beta.2"
tokio = "1.48.0"
digger-world-app = { version = "0.1.0", path = "digger-world/app" }
digger-world = { version = "0.1.0", path = "digger-world" }
digger-world-client = { version = "0.1.0", path = "digger-world/client" }
digger-proxy-app = { version = "0.1.0", path = "digger-proxy/app" }
digger-proxy-client = { version = "0.1.0", path = "digger-proxy/client" }
digger-res-vmt-app = { version = "0.1.0", path = "digger-res-vmt/app" }
digger-res-vmt-client = { version = "0.1.0", path = "digger-res-vmt/client" }
digger-redeem-app = { version = "0.1.0", path = "digger-redeem/app" }
digger-redeem-client = { version = "0.1.0", path = "digger-redeem/client" }
