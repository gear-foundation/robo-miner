<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Lock the viewport scale: pinch-zoom (trackpad two-finger / mobile)
       breaks UI alignment, so the game owns the entire surface and
       doesn't allow user-driven zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
  <title>Robo Miner</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #eee;
      /* Block native pinch-to-zoom on touch + most trackpad gestures. */
      touch-action: pan-x pan-y;
      -ms-content-zooming: none;
      overscroll-behavior: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      image-rendering: pixelated;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
